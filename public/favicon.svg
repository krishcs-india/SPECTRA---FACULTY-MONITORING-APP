<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#231229" />
      <stop offset="70%" stop-color="#180E1C" />
      <stop offset="100%" stop-color="#0F0912" />
    </radialGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#bgGlow)" stroke="url(#roseGrad)" stroke-width="2.5" />
  
  <!-- SPECTRA "S" monogram with luxury serif styling -->
  <text x="60" y="80" font-family="'Marcellus', serif, Georgia" font-size="64" font-weight="bold" fill="url(#roseGrad)" text-anchor="middle">S</text>
  
  <!-- Subtle accent spark -->
  <circle cx="85" cy="35" r="3" fill="#FDA4AF" />
  <circle cx="85" cy="35" r="1.5" fill="#FFFFFF" />
</svg>
