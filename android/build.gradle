// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                }
            }
        }
        // Keep Kotlin JVM target aligned with Java for plugin modules that use Kotlin
        if (project.pluginManager.hasPlugin("org.jetbrains.kotlin.android")) {
            project.tasks.configureEach { task ->
                if (task.name.contains("compileDebugKotlin") || task.name.contains("compileReleaseKotlin")) {
                    try {
                        task.kotlinOptions.jvmTarget = '21'
                    } catch (Exception ignored) {}
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
